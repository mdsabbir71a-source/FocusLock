name: Build Firebase analytics device test
on:
  push:
    branches: [firebase-analytics-device-test, restore-analytics-notification, fix-intermittent-lock-recovery, fix/block-pause-continuity]
  pull_request:
    branches: [fix-intermittent-lock-recovery, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test announcement completion policy
        run: |
          mkdir -p "$RUNNER_TEMP/announcement-test"
          javac -d "$RUNNER_TEMP/announcement-test" app/src/main/java/com/focuslock/app/AnnouncementPolicy.java tools/AnnouncementPolicyTest.java
          java -cp "$RUNNER_TEMP/announcement-test" com.focuslock.app.AnnouncementPolicyTest
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Download Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o gradle.zip
          unzip -q gradle.zip
      - name: Restore app configuration
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FOCUSLOCK_FIREBASE_ANDROID_CONFIG }}
        run: |
          test -n "$FIREBASE_ANDROID_CONFIG"
          printf '%s' "$FIREBASE_ANDROID_CONFIG" > app/google-services.json
          python3 -c 'import json; d=json.load(open("app/google-services.json")); assert any(c["client_info"]["android_client_info"]["package_name"] == "io.focuslock.app" for c in d["client"])'
      - name: Restore signing key
        env:
          FOCUSLOCK_KEYSTORE_BASE64: ${{ secrets.FOCUSLOCK_KEYSTORE_BASE64 }}
        run: |
          test -n "$FOCUSLOCK_KEYSTORE_BASE64"
          printf '%s' "$FOCUSLOCK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/focuslock-release.jks"
      - name: Build signed test APK
        env:
          FOCUSLOCK_KEYSTORE_PATH: ${{ runner.temp }}/focuslock-release.jks
          FOCUSLOCK_KEYSTORE_PASSWORD: ${{ secrets.FOCUSLOCK_KEYSTORE_PASSWORD }}
          FOCUSLOCK_KEY_ALIAS: ${{ secrets.FOCUSLOCK_KEY_ALIAS }}
          FOCUSLOCK_KEY_PASSWORD: ${{ secrets.FOCUSLOCK_KEY_PASSWORD }}
        run: ./gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Verify signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk'
      - name: Verify billing permission
        run: '"$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions app/build/outputs/apk/release/app-release.apk | grep -F com.android.vending.BILLING'
      - name: Verify advertising ID permissions are absent
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/permissions.txt"
          if grep -E 'com\.google\.android\.gms\.permission\.AD_ID|android\.permission\.ACCESS_ADSERVICES_AD_ID' "$RUNNER_TEMP/permissions.txt"; then
            echo "Unexpected advertising ID permission"
            exit 1
          fi
      - name: Verify bundle signature
        run: jarsigner -verify -certs app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-Firebase-Analytics-Test
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
