name: Build FocusLock private test APK

on:
  push:
    branches: [accessibility-compatibility-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Download Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o gradle.zip
          unzip -q gradle.zip
      - name: Restore signing key
        env:
          FOCUSLOCK_KEYSTORE_BASE64: ${{ secrets.FOCUSLOCK_KEYSTORE_BASE64 }}
        run: |
          test -n "$FOCUSLOCK_KEYSTORE_BASE64"
          echo "$FOCUSLOCK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/focuslock-release.jks"
      - name: Build signed private APK
        env:
          FOCUSLOCK_KEYSTORE_PATH: ${{ runner.temp }}/focuslock-release.jks
          FOCUSLOCK_KEYSTORE_PASSWORD: ${{ secrets.FOCUSLOCK_KEYSTORE_PASSWORD }}
          FOCUSLOCK_KEY_ALIAS: ${{ secrets.FOCUSLOCK_KEY_ALIAS }}
          FOCUSLOCK_KEY_PASSWORD: ${{ secrets.FOCUSLOCK_KEY_PASSWORD }}
        run: ./gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease
      - name: Verify signed APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-v1.0.73-Rotating-Lock-Cards-Test
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
