name: Build FocusLock APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      production_release:
        description: Build a production-signed APK
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Compile debug build
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  production:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.production_release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Prepare signing key
        id: signing_key
        env:
          KEYSTORE_BASE64: ${{ secrets.FOCUSLOCK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FOCUSLOCK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FOCUSLOCK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FOCUSLOCK_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/focuslock-production.p12"
          SIGNING_ENV="$RUNNER_TEMP/focuslock-signing.env"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            {
              echo "FOCUSLOCK_KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "FOCUSLOCK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "FOCUSLOCK_KEY_ALIAS=${KEY_ALIAS:-focuslock-production}"
              echo "FOCUSLOCK_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } > "$SIGNING_ENV"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "Existing production signing secrets are required; refusing to create a replacement key."
            exit 1
          fi
      - name: Build signed Play bundle and APK
        run: |
          set -a
          source "$RUNNER_TEMP/focuslock-signing.env"
          set +a
          gradle assembleRelease bundleRelease --stacktrace
      - name: Verify signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-production-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-production-Play-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
