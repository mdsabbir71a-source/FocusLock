name: Build FocusLock APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      production_release:
        description: Build a production-signed APK
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug build
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  production:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.production_release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FOCUSLOCK_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/focuslock-production.p12"
      - name: Build signed Play bundle and APK
        env:
          FOCUSLOCK_KEYSTORE_PATH: ${{ runner.temp }}/focuslock-production.p12
          FOCUSLOCK_KEYSTORE_PASSWORD: ${{ secrets.FOCUSLOCK_KEYSTORE_PASSWORD }}
          FOCUSLOCK_KEY_ALIAS: ${{ secrets.FOCUSLOCK_KEY_ALIAS }}
          FOCUSLOCK_KEY_PASSWORD: ${{ secrets.FOCUSLOCK_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace
      - name: Verify signature
        run: apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-production-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-production-Play-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
