name: Build FocusLock APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master, agent/two-protection-modes-v013]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assemblePrivateDnsDebug assembleDnsVpnDebug --stacktrace

      - name: Upload Private DNS APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-Private-DNS-APK
          path: app/build/outputs/apk/privateDns/debug/app-privateDns-debug.apk
          if-no-files-found: error

      - name: Upload DNS-only VPN APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-DNS-VPN-APK
          path: app/build/outputs/apk/dnsVpn/debug/app-dnsVpn-debug.apk
          if-no-files-found: error
