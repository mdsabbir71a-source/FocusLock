name: Build FocusLock APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      production_release:
        description: Build a production-signed APK
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug build
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  production:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.production_release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signing key
        id: signing_key
        env:
          KEYSTORE_BASE64: ${{ secrets.FOCUSLOCK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FOCUSLOCK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FOCUSLOCK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FOCUSLOCK_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/focuslock-production.p12"
          SIGNING_ENV="$RUNNER_TEMP/focuslock-signing.env"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            {
              echo "FOCUSLOCK_KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "FOCUSLOCK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "FOCUSLOCK_KEY_ALIAS=${KEY_ALIAS:-focuslock-production}"
              echo "FOCUSLOCK_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } > "$SIGNING_ENV"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            GENERATED_PASSWORD="$(openssl rand -base64 24 | tr -d '\n')"
            GENERATED_ALIAS="focuslock-production"
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -storetype PKCS12 -storepass "$GENERATED_PASSWORD" -alias "$GENERATED_ALIAS" -keypass "$GENERATED_PASSWORD" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FocusLock, OU=FocusLock, O=FocusLock, L=Dhaka, C=BD"
            {
              echo "FOCUSLOCK_KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "FOCUSLOCK_KEYSTORE_PASSWORD=$GENERATED_PASSWORD"
              echo "FOCUSLOCK_KEY_ALIAS=$GENERATED_ALIAS"
              echo "FOCUSLOCK_KEY_PASSWORD=$GENERATED_PASSWORD"
            } > "$SIGNING_ENV"
            cp "$KEYSTORE_PATH" "$RUNNER_TEMP/focuslock-signing-key.p12"
            cp "$SIGNING_ENV" "$RUNNER_TEMP/focuslock-signing-details.txt"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed Play bundle and APK
        run: |
          set -a
          source "$RUNNER_TEMP/focuslock-signing.env"
          set +a
          gradle assembleRelease bundleRelease --stacktrace
      - name: Preserve new signing key
        if: steps.signing_key.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-new-signing-key
          path: |
            ${{ runner.temp }}/focuslock-signing-key.p12
            ${{ runner.temp }}/focuslock-signing-details.txt
          retention-days: 7
      - name: Verify signature
        run: apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-production-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-production-Play-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
