<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FocusLock — Account</title>
  <style>
    :root{--screen:#f7f5ef;--ink:#132a1c;--muted:#5b6b5f;--green:#1f6b3b;--deep:#17532e;--line:#2f7a4a;--card:#fff;--border:rgba(31,107,59,.14);box-sizing:border-box}*{box-sizing:inherit}html,body{height:100%;margin:0}body{background:#e6e3da;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center}.phone{width:330px;height:714px;max-width:100%;overflow:hidden;position:relative;background:var(--screen);color:var(--ink);display:flex;flex-direction:column;border-radius:38px;box-shadow:0 18px 40px -18px rgba(19,42,28,.45)}.art{position:absolute;top:0;width:100%;pointer-events:none}.stroke{fill:none;stroke:var(--line);stroke-linecap:round;opacity:.24}.status,.head,.scroll,.nav{position:relative;z-index:1}.status{display:flex;justify-content:space-between;padding:14px 24px 0;color:var(--muted);font-size:12px}.status i{width:12px;height:8px;border:1px solid currentColor;border-radius:2px}.head{padding:16px 24px 0}.brand{margin:0;color:var(--deep);letter-spacing:.14em;font-size:11.5px;font-weight:800}.head h1{font-size:26px;margin:7px 0 5px;letter-spacing:-.03em}.head p{margin:0;color:var(--muted);font-size:13.5px}.scroll{flex:1;padding:19px 20px 12px;overflow:auto}.scroll::-webkit-scrollbar{display:none}.profile{background:var(--card);border:1.3px solid var(--border);border-radius:22px;padding:17px;display:flex;gap:12px;align-items:center}.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:rgba(31,107,59,.11);color:var(--deep);font-size:18px;font-weight:800}.profile strong{display:block;font-size:15px}.profile span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.section{margin-top:17px}.label{font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.1em;margin:0 0 7px 4px}.group{background:var(--card);border:1.3px solid var(--border);border-radius:20px;overflow:hidden}.row{width:100%;border:0;background:transparent;text-align:left;font:inherit;padding:14px 15px;display:flex;gap:11px;align-items:center;cursor:pointer}.row:active{background:rgba(31,107,59,.06)}.row+.row{border-top:1px solid var(--border)}.ico{width:28px;height:28px;border-radius:9px;background:rgba(31,107,59,.09);display:grid;place-items:center;color:var(--deep);font-weight:800}.copy{flex:1}.copy b{display:block;font-size:13.5px}.copy span{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}.chev{color:var(--green);font-size:19px}.plan{background:var(--deep);border-radius:20px;padding:16px;color:#f4f7f2;position:relative;overflow:hidden}.plan:after{content:"";width:120px;height:120px;border:1px solid rgba(255,255,255,.18);border-radius:50%;position:absolute;right:-42px;top:-48px}.plan small{font-size:10px;letter-spacing:.11em;font-weight:800}.plan b{display:block;font-size:16px;margin:6px 0}.plan span{font-size:12px;opacity:.78}.nav{border-top:1px solid var(--border);display:flex;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--screen)}.nav div{flex:1;text-align:center;color:var(--muted);font-size:10px;font-weight:700}.nav i{display:block;font-size:19px;font-style:normal;margin-bottom:3px}.nav .active{color:var(--deep)}@media(max-width:400px){.phone{height:min(714px,calc(92vw * 2.163))}}
  </style>
</head>
<body><main class="phone"><div class="art"><svg viewBox="0 0 330 90"><path class="stroke" d="M-10 30c62 12 100-9 153 2s89 5 198-12"/><path class="stroke" d="M45 20c5-6 10-6 13 0 3-6 8-6 13 0M260 44c5-6 10-6 13 0 3-6 8-6 13 0"/></svg></div><div class="status"><span>9:14 <small>AM</small></span><i></i></div><header class="head"><p class="brand">FOCUSLOCK</p><h1>Your account</h1><p>Manage your FocusLock experience.</p></header><section class="scroll"><div class="profile"><div class="avatar">F</div><div><strong>FocusLock user</strong><span>Signed in securely</span></div></div><div class="section"><p class="label">MEMBERSHIP</p><div class="plan"><small>FOCUSLOCK FREE</small><b>Your focus is protected</b><span>Upgrade options will appear here when available.</span></div></div><div class="section"><p class="label">ACCOUNT</p><div class="group"><button class="row" data-action="details"><div class="ico">✦</div><div class="copy"><b>Personal details</b><span>Name and email</span></div><div class="chev">›</div></button><button class="row" data-action="notifications"><div class="ico">◌</div><div class="copy"><b>Notifications</b><span>Gentle focus reminders</span></div><div class="chev">›</div></button><button class="row" data-action="support"><div class="ico">?</div><div class="copy"><b>Help & support</b><span>Guides and contact</span></div><div class="chev">›</div></button></div></div><div class="section"><p class="label">SECURITY</p><div class="group"><button class="row" data-action="password"><div class="ico">⌁</div><div class="copy"><b>Change password</b><span>Keep your account secure</span></div><div class="chev">›</div></button><button class="row" data-action="signout"><div class="ico">↪</div><div class="copy"><b>Sign out</b><span>Use a different account</span></div><div class="chev">›</div></button></div></div></section><nav class="nav"><div><i>⌂</i>Home</div><div><i>▥</i>Analytics</div><div class="active"><i>⚙</i>Account</div></nav></main></body>
</html>
