<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FocusLock – Analytics</title>
<style>
/* ---------- Design tokens ---------- */
:root{--bg:#f7f5ef;--card:#fff;--ink:#16281d;--mute:#6b7a70;--g:#1a5632;--g2:#3f8a5c;--tint:#e6f0e8;--line:#dce8dc;--hero:#1a5632;--on-g:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1712;--card:#16231b;--ink:#e8f0ea;--mute:#93a599;--g:#6fc48e;--g2:#4c9f6c;--tint:#1f3327;--line:#25352b;--hero:#1f5a37;--on-g:#0e1712}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--g2);outline-offset:2px}
.app{position:relative;max-width:none;margin:0;padding:14px 18px 106px;overflow:hidden}
.line-art{position:absolute;inset:0 auto auto 0;width:100%;height:112px;pointer-events:none;opacity:.26}
.line-art path{fill:none;stroke:var(--g2);stroke-width:1.2;stroke-linecap:round}
.app>*:not(.line-art){position:relative;z-index:1}
.brand{font-weight:800;letter-spacing:.14em;font-size:13px;color:var(--g)}
h1{font-size:32px;line-height:1.1;margin:6px 0 12px;font-weight:800;letter-spacing:-.02em}

/* ---------- One control for the whole screen ---------- */
.rng{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 12px}
.seg{display:flex;background:var(--tint);border-radius:999px;padding:4px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font-weight:600;font-size:15px;padding:11px 6px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--g);color:var(--on-g)}

/* ---------- Summary ---------- */
.hero{background:var(--hero);color:#f2f7f3;border-radius:26px;padding:22px 20px 18px}
.two{display:grid;grid-template-columns:1fr 1fr}
.two>div+div{border-left:1px solid rgba(255,255,255,.2);padding-left:18px}
.k{font-size:14px;opacity:.8}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.delta{margin:14px 0 0;font-size:14px;background:rgba(255,255,255,.14);border-radius:12px;padding:9px 12px}
.all{margin:12px 2px 0;font-size:13px;opacity:.85;display:flex;justify-content:space-between}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px}
@keyframes settle-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.hero{animation:settle-in .22s ease-out both}.card{animation:settle-in .26s ease-out both}.card:nth-of-type(2){animation-delay:.035s}.card:nth-of-type(3){animation-delay:.07s}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.head h2{font-size:18px;margin:0;font-weight:600}
.pill{display:flex;background:var(--tint);border-radius:999px;padding:3px}
.pill button{border:0;background:none;color:var(--mute);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px}
.pill button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.read{min-height:52px}
.read b{font-size:28px;font-weight:800;letter-spacing:-.02em}
.read span{display:block;color:var(--mute);font-size:13px}
svg{width:100%;height:auto;display:block}
.bar{fill:var(--tint)}.bar.on{fill:var(--g2)}
.ax{fill:var(--mute);font-size:10px;font-family:inherit}
.hint{color:var(--mute);font-size:13px;margin:0 0 6px}

/* ---------- App rows ---------- */
.app-r{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.app-r:first-of-type{border-top:0}
.ic{width:40px;height:40px;border-radius:12px;background:#fff!important;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;padding:4px}
.ic img{width:100%;height:100%;object-fit:contain;display:block}
.nm{font-weight:600;font-size:15px}
.trk{height:6px;background:var(--tint);border-radius:9px;margin-top:7px;overflow:hidden}
.trk i{display:block;height:100%;background:var(--g2);border-radius:9px}
.rt{text-align:right;font-weight:600;font-size:15px}
.rt small{display:block;color:var(--mute);font-weight:400;font-size:12px}

/* ---------- Bottom nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:none;margin:0 auto;justify-content:space-around;padding:8px 10px 10px}
nav span{display:grid;justify-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--mute);cursor:pointer}
nav .a{color:var(--g)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body><main class="app">
<svg class="line-art" viewBox="0 0 390 112" aria-hidden="true"><path d="M-18 31c70 14 109-12 166 0s108 5 260-18"/><path d="M49 19c5-6 10-6 13 0 3-6 8-6 13 0M301 49c5-6 10-6 13 0 3-6 8-6 13 0"/></svg>
<div class="brand">FOCUSLOCK</div>
<h1>Your progress</h1>

<div class="rng"><div class="seg" id="rng" role="group" aria-label="Time range">
  <button data-r="24h">Day</button><button data-r="7d">Week</button><button data-r="30d">Month</button></div></div>

<section class="hero" aria-label="Summary">
  <div class="two">
    <div><div class="k">Pauses kept</div><div class="big" id="hp"></div></div>
    <div><div class="k">Time saved</div><div class="big" id="hs"></div></div>
  </div>
  <div class="delta" id="delta"></div>
  <div class="all"><span>All time</span><span id="all"></span></div>
</section>

<section class="card">
  <div class="head"><h2>By app</h2></div>
  <div id="apps"></div>
</section>

<section class="card">
  <div class="head"><h2>Progress</h2>
    <div class="pill" id="met"><button data-m="p">Pauses</button><button data-m="s">Time saved</button></div></div>
  <p class="hint">Tap a bar to see its details.</p>
  <div class="read" id="read"></div>
  <svg id="chart" viewBox="0 0 340 150" role="img" aria-label="Bar chart of your progress"></svg>
</section>
</main>

<nav><div>
  <span><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Home</span>
  <span class="a"><svg viewBox="0 0 24 24"><path d="M6 20V11M12 20V4M18 20v-6"/></svg>Analytics</span>
  <span><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Account</span>
</div></nav>

<script>
(function(){
/* Data is supplied by FocusLock from this device only.
   P: {t: timestamp in ms, p: package name, s: milliseconds saved}
   APPS: {p: package name, n: label, i: installed app icon data URI} */
var APPS=[],H=36e5,D=864e5,now=Date.now(),P=[];
var t0=new Date();t0.setHours(0,0,0,0);

var st={r:'7d',m:'p',sel:null},$=function(i){return document.getElementById(i)};
var SPAN={'24h':24*H,'7d':7*D,'30d':30*D},NAME={'24h':'24 hours','7d':'7 days','30d':'30 days'};
function f(ms){var s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'h '+m+'m':m?m+'m':s+'s'}
function sum(l){return l.reduce(function(x,p){return x+p.s},0)}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}
function between(a,b){return P.filter(function(p){return p.t>=a&&p.t<b})}
function buckets(){var b=[],i,n;
 if(st.r=='24h'){for(i=0;i<24;i++){var e=now-(23-i)*H;b.push({s:e-H,e:e,l:new Date(e).toLocaleTimeString([],{hour:'numeric'}),full:'Hour ending '+new Date(e).toLocaleTimeString([],{hour:'numeric'})})}}
 else{n=st.r=='7d'?7:30;for(i=0;i<n;i++){var s=t0.getTime()-(n-1-i)*D,dt=new Date(s);
  b.push({s:s,e:s+D,l:n==7?dt.toLocaleDateString([],{weekday:'short'}):dt.getDate()+'',full:dt.toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'})})}}
 return b}

function summary(){
 var sp=SPAN[st.r],cur=between(now-sp,now+1),prev=between(now-2*sp,now-sp),dl=cur.length-prev.length;
 $('hp').textContent=cur.length;$('hs').textContent=f(sum(cur));
 $('delta').textContent=dl>0?dl+' more pauses than the previous '+NAME[st.r]:dl<0?Math.abs(dl)+' fewer pauses than the previous '+NAME[st.r]:'Same number of pauses as the previous '+NAME[st.r];
 $('all').textContent=P.length+' pauses · '+f(sum(P))+' saved'}

function chart(){
 var B=buckets(),m=st.m,vals=B.map(function(b){var l=between(b.s,b.e);return m=='p'?l.length:sum(l)});
 var mx=Math.max.apply(null,vals)||1,W=340,h=118,n=B.length,w=W/n,bw=w*(n>20?.62:.5),k=n==24?6:n==30?5:1,s='';
 if(st.sel==null||st.sel>=n)st.sel=n-1;
 vals.forEach(function(v,i){var bh=Math.max(v?4:2,v/mx*h),x=i*w+(w-bw)/2;
  s+='<rect class="bar'+(i==st.sel?' on':'')+'" x="'+x+'" y="'+(h-bh)+'" width="'+bw+'" height="'+bh+'" rx="'+Math.min(6,bw/2)+'"/>';
  s+='<rect data-i="'+i+'" x="'+i*w+'" y="0" width="'+w+'" height="150" fill="transparent" style="cursor:pointer"/>';
  if(i%k==0)s+='<text class="ax" x="'+(i*w+w/2)+'" y="140" text-anchor="middle">'+B[i].l+'</text>'});
 $('chart').innerHTML=s;
 var v=vals[st.sel];
 $('read').innerHTML='<b>'+(m=='p'?v+(v==1?' pause':' pauses'):f(v)+' saved')+'</b><span>'+B[st.sel].full+'</span>'}

function apps(){
 var l=between(now-SPAN[st.r],now+1),g=APPS.map(function(a){var x=l.filter(function(p){return p.p==a.p});return{a:a,c:x.length,s:sum(x)}}).sort(function(x,y){return y.c-x.c}),mx=g.length&&g[0].c||1;
 $('apps').innerHTML=g.length?g.map(function(x){return '<div class="app-r"><div class="ic"><img src="'+esc(x.a.i)+'" alt=""></div><div><div class="nm">'+esc(x.a.n)+'</div><div class="trk"><i style="width:'+(x.c/mx*100)+'%"></i></div></div><div class="rt">'+x.c+(x.c==1?' pause':' pauses')+'<small>'+f(x.s)+' saved</small></div></div>'}).join(''):'<p class="hint">Choose apps to protect and your activity will appear here.</p>'}

function all(){
 [].forEach.call(document.querySelectorAll('#rng button'),function(b){b.setAttribute('aria-pressed',b.dataset.r==st.r)});
 [].forEach.call(document.querySelectorAll('#met button'),function(b){b.setAttribute('aria-pressed',b.dataset.m==st.m)});
 summary();chart();apps()}
$('rng').onclick=function(e){var b=e.target.closest('button');if(b){st.r=b.dataset.r;st.sel=null;all()}};
$('met').onclick=function(e){var b=e.target.closest('button');if(b){st.m=b.dataset.m;all()}};
$('chart').onclick=function(e){var i=e.target.getAttribute('data-i');if(i!=null){st.sel=+i;chart()}};
window.setFocusLockData=function(events,apps){P=Array.isArray(events)?events:[];APPS=Array.isArray(apps)?apps:[];now=Date.now();t0=new Date();t0.setHours(0,0,0,0);st.sel=null;all()};
all();
})();
</script></body></html>
