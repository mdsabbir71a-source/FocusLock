<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FocusLock — Lock Card (Tide)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --screen:#F7F5EF;--ink:#132A1C;--ink-soft:#5B6B5F;--green:#1F6B3B;--green-deep:#17532E;--line:#2F7A4A;
    --page-bg:#E6E3DA;--page-ink:#22312a;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--page-bg:#141C17;--page-ink:#DDE5DE}
  }
  :root[data-theme="dark"]{--page-bg:#141C17;--page-ink:#DDE5DE}
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
  body{
    margin:0;min-height:100%;background:var(--page-bg);color:var(--page-ink);
    font-family:"Schibsted Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:32px 16px;
  }

  .phone{
    width:330px;height:714px;max-width:100%;border-radius:38px;position:relative;overflow:hidden;
    background:var(--screen);color:var(--ink);
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 18px 40px -18px rgba(19,42,28,.45);
    display:flex;flex-direction:column;
  }
  .art{position:absolute;left:0;right:0;pointer-events:none}
  .art svg{display:block;width:100%;height:auto}
  .stroke{fill:none;stroke:var(--line);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}

  .body{position:relative;z-index:2;display:flex;flex-direction:column;flex:1;padding:0 24px 24px;align-items:center}
  .status{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 0 0;font-size:12px;font-weight:500;color:var(--ink-soft)}
  .status i{display:block;width:12px;height:8px;border:1px solid currentColor;border-radius:2px;opacity:.6}
  .brandline{text-align:center;font-size:12px;font-weight:700;letter-spacing:.14em;margin:18px 0 0;color:var(--green-deep)}
  .appline{display:flex;align-items:center;gap:7px;margin-top:24px;font-size:14.5px;color:var(--ink-soft)}
  .appline svg{width:15px;height:15px}
  h2.headline{font-size:26px;line-height:1.14;font-weight:700;letter-spacing:-.02em;text-align:center;margin:8px 0 0;max-width:14ch}
  .quote{width:100%;border-radius:22px;padding:20px;text-align:center;font-size:15.5px;font-weight:600;line-height:1.4;border:1.5px solid rgba(31,107,59,.16);background:rgba(255,255,255,.82);color:var(--ink)}
  .spacer{flex:1}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:999px;font-size:15.5px;font-weight:600;font-family:inherit;text-decoration:none;letter-spacing:-.005em;background:rgba(31,107,59,.12);color:var(--green-deep);border:1.5px solid rgba(31,107,59,.3)}
  .btn:focus-visible{outline:2px solid var(--green);outline-offset:3px}
  .footer{text-align:center;font-size:11.5px;margin-top:14px;color:var(--ink-soft)}
  .homebar{width:112px;height:4px;border-radius:99px;margin:14px auto 0;background:rgba(19,42,28,.22)}

  .timer{position:relative;display:flex;align-items:center;justify-content:center}
  .timer > svg{position:absolute;inset:0;width:100%;height:100%}
  .t-face{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
  .t-label{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--ink-soft)}
  .t-clock{font-family:"Space Mono",monospace;font-weight:700;color:var(--ink);letter-spacing:.01em}

  .t-glass{width:210px;height:212px;margin:14px 0 14px;flex-direction:column;gap:10px}
  .t-glass .t-clock{font-size:34px}

  @media (max-width:400px){ .phone{height:min(714px,calc(92vw * 2.163))} }
</style>
</head>
<body>
<div class="phone">
  <div class="art" style="top:0">
    <svg viewBox="0 0 330 178" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g class="stroke" opacity=".22" stroke-width="1">
        <path d="M-8 44c48 10 82-12 126-2s86 8 216-14"/>
        <path d="M-8 72c40 8 70-12 110-4s78 8 232-12"/>
        <path d="M40 104c40 8 70-10 108-4s70 6 190-10" opacity=".7"/>
      </g>
      <g class="stroke" opacity=".4" stroke-width="1.4">
        <path d="M52 40c6-8 13-8 17 0 4-8 11-8 17 0"/>
        <path d="M98 66c5-6 10-6 13 0 3-6 8-6 13 0" opacity=".75"/>
        <path d="M70 96c4-5 8-5 11 0 3-5 7-5 11 0" opacity=".55"/>
      </g>
      <g class="stroke" opacity=".3" stroke-width="1.2">
        <path d="M244 132v-46"/>
        <path d="M244 108c-13-4-20-13-20-27 13 0 20 12 20 27zM244 96c13-4 17-15 15-28-13 0-17 11-15 28"/>
      </g>
    </svg>
  </div>
  <div class="art" style="bottom:0">
    <svg viewBox="0 0 330 200" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g class="stroke" opacity=".34" stroke-width="1.4">
        <path d="M-14 96c40-12 68 8 100-2s50-24 88-14 58 22 100 10 56-20 92-8"/>
      </g>
      <g class="stroke" opacity=".24" stroke-width="1.2">
        <path d="M-14 132c46-12 78 6 114-4s52-22 96-10 60 20 106 8 54-18 88-6"/>
        <path d="M-14 166c52-12 88 6 124-4s54-20 102-8"/>
        <path d="M-14 196c58-12 98 4 138-6" opacity=".8"/>
      </g>
      <g class="stroke" opacity=".38" stroke-width="1.3">
        <path d="M222 92h46l-9 16h-28z"/>
        <path d="M245 92V58M245 62c12 4 20 10 24 18h-24" opacity=".8"/>
      </g>
    </svg>
  </div>

  <div class="body">
    <div class="status"><span>7:48<span style="font-size:10px"> AM</span></span><i></i></div>
    <p class="brandline">FOCUSLOCK</p>
    <div class="appline">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      YouTube is paused
    </div>
    <h2 class="headline">Take a quiet moment</h2>

    <div class="timer t-glass">
      <svg viewBox="0 0 210 212" aria-hidden="true" style="position:relative;height:150px">
        <g class="stroke" stroke-width="1.5" opacity=".5">
          <path d="M62 16h86M62 196h86"/>
          <path d="M68 16c0 34 12 56 37 90-25 34-37 56-37 90"/>
          <path d="M142 16c0 34-12 56-37 90 25 34 37 56 37 90"/>
        </g>
        <!-- sand remaining, top -->
        <g class="stroke" stroke-width="1.2" opacity=".35">
          <path d="M77 52h56M81 64h48M86 76h38M92 88h26"/>
        </g>
        <!-- falling grains -->
        <g class="stroke" stroke-width="1.4" opacity=".55">
          <path d="M105 112v8M105 128v6M105 142v5"/>
        </g>
        <!-- sand collected, bottom -->
        <g class="stroke" stroke-width="1.2" opacity=".4">
          <path d="M84 196c4-14 11-22 21-22s17 8 21 22"/>
          <path d="M92 196c3-9 7-14 13-14s10 5 13 14" opacity=".7"/>
        </g>
        <g class="stroke" stroke-width="1" opacity=".22">
          <path d="M36 106c-8 0-14 0-20 2M174 106c8 0 14 0 20 2"/>
          <path d="M40 78c-8-2-14-3-20-2M170 78c8-2 14-3 20-2" opacity=".7"/>
          <path d="M40 134c-8 2-14 3-20 2M170 134c8 2 14 3 20 2" opacity=".7"/>
        </g>
      </svg>
      <div class="t-face">
        <span class="t-clock">09:53</span>
        <span class="t-label" style="margin-top:4px">UNLOCKS AT 8:04</span>
      </div>
    </div>

    <div class="quote">A small pause protects a bigger purpose.</div>
    <div class="spacer"></div>
    <a class="btn" href="#">Return to home</a>
    <p class="footer">FocusLock is protecting your time</p>
    <div class="homebar"></div>
  </div>
</div>
</body>
</html>
