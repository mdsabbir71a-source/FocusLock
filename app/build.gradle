plugins { id 'com.android.application' }

android {
    namespace 'com.focuslock.app'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.focuslock.app'
        minSdk 23
        targetSdk 36
        // v1.0.89 is the first release rebuilt from the working 1.0.88 APK
        // as a behavioral reference. Keep this higher than the test build so
        // Play and test devices accept it as an update.
        versionCode 189
        versionName '1.0.89'
        buildConfigField 'String', 'SUPABASE_URL', '"https://sfrwqrjwyzhabmquythi.supabase.co"'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"sb_publishable_Y3Xl3f_pmMX3bZblCvjXmw_c2l1iPM7"'
        // Existing web OAuth client used by the FocusLock Supabase Google provider.
        // Client IDs are public identifiers; no OAuth secret is shipped in the app.
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', '"903382171595-nvu86ovqovbago4lq10r9cekn52dm6k0.apps.googleusercontent.com"'
        buildConfigField 'String', 'PUBLIC_SITE_URL', '"https://focuslock-app.mdsabbir71a.chatgpt.site"'
        buildConfigField 'String', 'SUPPORT_EMAIL', '"mdsabbir71a@gmail.com"'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('FOCUSLOCK_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('FOCUSLOCK_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FOCUSLOCK_KEY_ALIAS') ?: 'focuslock-production'
                keyPassword System.getenv('FOCUSLOCK_KEY_PASSWORD') ?: System.getenv('FOCUSLOCK_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError true
    }
}

dependencies {
    implementation "androidx.credentials:credentials:1.5.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
