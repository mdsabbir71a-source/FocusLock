plugins { id 'com.android.application' }

android {
    namespace 'com.focuslock.app'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        // Google Play app record was created with this permanent package name.
        // Keep the namespace unchanged so the existing Java source packages
        // and generated resource references remain stable.
        applicationId 'io.focuslock.app'
        minSdk 23
        targetSdk 36
        // Increment for the Play Console replacement bundle. Existing testers
        // can install this as an update over the current v1.0.89 release.
        // Play Console permanently reserves uploaded version codes. Keep this
        // release functionally identical while allowing it to replace the
        // already-uploaded code 200 bundle.
        versionCode 225
        versionName '1.1.25'
        buildConfigField 'String', 'SUPABASE_URL', '"https://sfrwqrjwyzhabmquythi.supabase.co"'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"sb_publishable_Y3Xl3f_pmMX3bZblCvjXmw_c2l1iPM7"'
        buildConfigField 'String', 'PUBLIC_SITE_URL', '"https://focuslock.io"'
        buildConfigField 'String', 'SUPPORT_EMAIL', '"mdsabbir71a@gmail.com"'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('FOCUSLOCK_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('FOCUSLOCK_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FOCUSLOCK_KEY_ALIAS') ?: 'focuslock-production'
                keyPassword System.getenv('FOCUSLOCK_KEY_PASSWORD') ?: System.getenv('FOCUSLOCK_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError true
    }
}
